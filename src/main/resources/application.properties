spring.application.name=demo

# JWT 配置（生产环境密钥必须使用强随机值，至少 32 字节，且不要提交到代码仓库）
jwt.secret=demo-jwt-secret-key-please-change-in-production-1234567890
jwt.expiration-ms=3600000

server.address=0.0.0.0
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ?????sql
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mqtt.broker-url: tcp://localhost:1883
mqtt.client-id: spring-server-${random.uuid}
mqtt.username: ""
mqtt.password: ""
mqtt.default-qos: 1
mqtt.default-topic: instrument/notify
# topic
mqtt.subscribe-topics: instrument/status,instrument/data,app/request
